[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locc"
version = "1.0.0"
description = "Lines of Code Counter with rich terminal output"
readme = "README.md"
authors = [{name = "Lucas Emannuel", email = "pestebubonica088@proton.me"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
locc = "locc:app"

[project.urls]
Homepage = "https://github.com/lucasemannuelll/locc"
Repository = "https://github.com/lucasemannuelll/locc"
